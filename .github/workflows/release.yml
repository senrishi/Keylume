name: Publish release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  release:
    name: Publish desktop downloads
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Verify tag matches app versions
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          test "$(node -p "require('./apps/windows/package.json').version")" = "$(cat VERSION)"
      - uses: actions/download-artifact@v5
        with:
          name: Keylume-macOS
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: Keylume-Windows
          path: release
      - uses: actions/download-artifact@v5
        with:
          name: Keylume-Web
          path: web-build
      - name: Package self-hostable web app and checksums
        run: |
          cd web-build
          zip -r "../release/Keylume-$(cat ../VERSION)-Web.zip" .
          cd ../release
          sha256sum *.zip *.exe > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --title "Keylume $GITHUB_REF_NAME" --notes-file docs/release-notes.md
